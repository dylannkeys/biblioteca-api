name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Comprobar formato
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Análisis estático
        run: go vet ./...

      - name: Tests (con detector de carreras)
        run: go test -race -coverprofile=cover.out ./...

      - name: Cobertura
        run: go tool cover -func=cover.out | tail -1

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t biblioteca-api .

      - name: Prueba de humo
        run: |
          docker run -d --name api -p 8080:8080 -e SEED=1 biblioteca-api
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/health
          curl --fail --silent "http://localhost:8080/books?q=rulfo" | grep -q "Pedro Páramo"
          docker logs api
